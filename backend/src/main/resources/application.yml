spring:
  application:
    name: offerpilot-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/offerpilot}
    username: ${DB_USER:offerpilot}
    password: ${DB_PASSWORD:offerpilot_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:12h}
    redis:
      namespace: offerpilot:session
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${QWEN_API_KEY:demo-key-not-used}
      chat:
        options:
          model: ${QWEN_CHAT_MODEL:qwen-plus}
          temperature: 0.2
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: OFFERPILOT_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
offerpilot:
  memory:
    mode: ${MEMORY_MODE:lightweight}
    tencentdb:
      base-url: ${MEMORY_BASE_URL:http://localhost:8420}
      team-id: ${MEMORY_TEAM_ID:offerpilot}
      agent-id: ${MEMORY_AGENT_ID:offer-advisor}
      gateway-api-key: ${MEMORY_GATEWAY_API_KEY:local}
  ai:
    enabled: ${AI_ENABLED:false}
    harness:
      max-skill-calls: 6
      web-cache-minutes: 15
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: ${QWEN_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    embedding-model: ${QWEN_EMBEDDING_MODEL:text-embedding-v4}
    embedding-dimensions: 1024
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

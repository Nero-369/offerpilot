spring:
  application:
    name: offerpilot-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/offerpilot}
    username: ${DB_USER:offerpilot}
    password: ${DB_PASSWORD:offerpilot_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${QWEN_API_KEY:demo-key-not-used}
      chat:
        options:
          model: ${QWEN_CHAT_MODEL:qwen-plus}
          temperature: 0.2
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
offerpilot:
  ai:
    enabled: ${AI_ENABLED:false}
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: ${QWEN_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    embedding-model: ${QWEN_EMBEDDING_MODEL:text-embedding-v4}
    embedding-dimensions: 1024
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
